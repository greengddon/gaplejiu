<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가플지우 | Ocean Campaign Design Archive</title><style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Pretendard,'Noto Sans KR',system-ui,-apple-system,sans-serif;background:#f5fafc;color:#143c50}button{font:inherit}header{background:linear-gradient(112deg,#d4f6ff 0%,#9ee5f6 52%,#52b6d8 100%);padding:72px max(24px,calc((100vw - 1100px)/2)) 78px;min-height:310px;display:flex;align-items:center}header .inner{width:100%;max-width:1100px}header small,.eyebrow{font-size:12px;letter-spacing:2.5px;color:#0878a1;font-weight:800}h1{font-size:clamp(40px,5.4vw,72px);line-height:1.17;letter-spacing:-3px;margin:24px 0 25px;color:#0d4c74}header p{font-size:17px;line-height:1.85;margin:0}main{max-width:1100px;margin:auto;padding:65px 24px 100px}h2{font-size:32px;letter-spacing:-1.2px;margin:16px 0}main .desc{color:#557b8d;font-size:14px;margin-bottom:36px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.work{background:white;border:1px solid #dcebf0;border-radius:18px;overflow:hidden;cursor:pointer;text-align:left;padding:0;box-shadow:0 8px 24px #1c78900b;transition:transform .2s,box-shadow .2s}.work:hover{transform:translateY(-4px);box-shadow:0 15px 32px #1c789025}.thumb{height:280px;display:flex;justify-content:center;align-items:center;padding:18px;background:#e8f6fa}.thumb img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 4px 7px #17475c18)}.thumb.duo{gap:12px}.thumb.duo img{max-width:48%}.meta{padding:22px 24px}.meta strong{display:block;font-size:21px;margin-bottom:8px}.meta span{font-size:13px;color:#678595}.work.feature{grid-column:1/-1}.work.feature .thumb{height:320px}.work.feature .thumb img{max-height:100%}.overlay{position:fixed;inset:0;z-index:20;background:rgba(5,21,32,.92);display:none;align-items:center;justify-content:center;padding:65px 76px 72px}.overlay.open{display:flex}.viewer{height:100%;width:100%;display:flex;align-items:center;justify-content:center;gap:12px}.viewer img{max-height:100%;max-width:100%;object-fit:contain;border-radius:3px}.viewer.two img{max-width:49%}.close,.arrow{position:absolute;border:0;background:#ffffff24;color:white;cursor:pointer;border-radius:50%;display:grid;place-items:center}.close{right:22px;top:20px;width:42px;height:42px;font-size:27px}.arrow{top:50%;transform:translateY(-50%);width:44px;height:44px;font-size:28px}.prev{left:18px}.next{right:18px}.counter{position:absolute;bottom:24px;color:#fff;font-size:14px;letter-spacing:1px}.hint{color:#fff9;position:absolute;bottom:7px;font-size:11px}@media(max-width:650px){header{padding:55px 24px 60px;min-height:290px}h1{letter-spacing:-2px}header p{font-size:14px}main{padding:52px 18px 70px}.grid{grid-template-columns:1fr;gap:17px}.work.feature{grid-column:auto}.thumb,.work.feature .thumb{height:250px}.meta{padding:18px 20px}.overlay{padding:66px 48px 65px}.arrow{width:34px;height:34px;font-size:24px}.prev{left:6px}.next{right:6px}.viewer.two{flex-direction:column}.viewer.two img{max-width:100%;max-height:48%}}
</style></head><body><header><div class="inner"><small>GAPLEJIU · OCEAN CAMPAIGN</small><h1>가져와요 플라스틱,<br>지켜가요 우리바다.</h1><p>작은 실천이 모여 깨끗한 바다를 만듭니다.<br>가플지우 해양환경 캠페인 디자인 아카이브</p></div></header><main><div class="eyebrow">CAMPAIGN DESIGN</div><h2>프로젝트 작품 보기</h2><p class="desc">작품을 클릭하면 원본 디자인을 크게 볼 수 있습니다. 좌우 화살표로 다른 작품과 카드뉴스를 감상해 보세요.</p><div class="grid" id="grid"></div></main><div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="작품 크게 보기"><button class="close" id="close" aria-label="닫기">×</button><button class="arrow prev" id="prev" aria-label="이전">‹</button><div class="viewer" id="viewer"></div><button class="arrow next" id="next" aria-label="다음">›</button><div class="counter" id="counter"></div><div class="hint">ESC 닫기 · ← → 넘기기</div></div><script>
const works=[{"title": "리플릿", "imgs": ["images/work1_1.webp", "images/work1_2.webp"]}, {"title": "포스터 01", "imgs": ["images/work2_1.webp"]}, {"title": "포스터 02", "imgs": ["images/work3_1.webp"]}, {"title": "X배너 01", "imgs": ["images/work4_1.webp"]}, {"title": "X배너 02", "imgs": ["images/work5_1.webp"]}, {"title": "카드뉴스", "imgs": ["images/work6_1.webp", "images/work6_2.webp", "images/work6_3.webp", "images/work6_4.webp", "images/work6_5.webp", "images/work6_6.webp", "images/work6_7.webp", "images/work6_8.webp"]}];const grid=document.getElementById('grid');const overlay=document.getElementById('overlay');const viewer=document.getElementById('viewer');let current=0;let slide=0;
works.forEach((work,index)=>{const btn=document.createElement('button');btn.className='work'+(index===0?' feature':'');let thumbs=work.imgs.slice(0,index===0?2:1);btn.innerHTML='<div class="thumb '+(thumbs.length===2?'duo':'')+'">'+thumbs.map(p=>'<img src="'+p+'" alt="">').join('')+'</div><div class="meta"><strong>'+work.title+'</strong><span>'+(work.imgs.length>2?work.imgs.length+'장 · 클릭하여 넘겨보기':work.imgs.length===2?'2면 · 클릭하여 크게 보기':'클릭하여 크게 보기')+' ↗</span></div>';btn.onclick=()=>open(index);grid.appendChild(btn)});
function open(i){current=i;slide=0;overlay.classList.add('open');document.body.style.overflow='hidden';render()}
function render(){const w=works[current];viewer.className='viewer'+(current===0?' two':'');viewer.innerHTML='';const paths=current===0?w.imgs:[w.imgs[slide]];paths.forEach(path=>{const img=document.createElement('img');img.src=path;img.alt=w.title;viewer.appendChild(img)});document.getElementById('counter').textContent=w.title+'  ·  '+(current===0?'전체 2면':(slide+1)+' / '+w.imgs.length);}
function move(delta){const w=works[current];if(current!==0&&w.imgs.length>1){const next=slide+delta;if(next>=0&&next<w.imgs.length){slide=next;render();return}}current=(current+delta+works.length)%works.length;slide=delta<0?works[current].imgs.length-1:0;render()}
function close(){overlay.classList.remove('open');document.body.style.overflow=''}document.getElementById('close').onclick=close;document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);overlay.addEventListener('click',e=>{if(e.target===overlay)close()});document.addEventListener('keydown',e=>{if(!overlay.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});let touchX=null;viewer.addEventListener('touchstart',e=>touchX=e.changedTouches[0].screenX,{passive:true});viewer.addEventListener('touchend',e=>{if(touchX===null)return;const diff=e.changedTouches[0].screenX-touchX;if(Math.abs(diff)>50)move(diff<0?1:-1);touchX=null},{passive:true});
</script></body></html>
