<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가플지우 | 바다를 위한 작은 실천</title><style>
:root{--navy:#123b61;--blue:#2188bd;--sky:#dff6fc}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Pretendard,'Noto Sans KR',Arial,sans-serif;color:#17394d;background:#f6fbfd}button{font:inherit;cursor:pointer}header{background:linear-gradient(125deg,#dff8ff,#7bd4ec 70%,#3ea8d4);padding:48px 24px 58px;position:relative;overflow:hidden}header:after{content:'';position:absolute;width:140%;height:65px;background:#f6fbfd;bottom:-48px;left:-20%;border-radius:50%}header .inner,main{max-width:1160px;margin:auto}header .eyebrow{font-size:14px;letter-spacing:.2em;font-weight:800;color:#12669a}h1{font-size:clamp(38px,5vw,68px);line-height:1.13;margin:14px 0;color:#0e4d7b;letter-spacing:-.06em}header p{font-size:clamp(16px,2vw,22px);line-height:1.7}main{padding:35px 24px 70px}.section-label{color:#1689b8;font-weight:800;letter-spacing:.16em;font-size:13px}.section-title{font-size:clamp(27px,4vw,39px);margin:12px 0 10px;letter-spacing:-.05em}.desc{color:#617b8b;line-height:1.8;margin-bottom:34px}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.tile{border:1px solid #d9edf3;background:white;border-radius:18px;overflow:hidden;text-align:left;padding:0;box-shadow:0 9px 25px #1c749414;transition:transform .2s,box-shadow .2s}.tile:hover,.tile:focus-visible{transform:translateY(-7px);box-shadow:0 17px 34px #1c74942c;outline:2px solid #48b5df;outline-offset:2px}.thumb{height:300px;background:#e8f5f9;display:flex;align-items:center;justify-content:center;padding:18px}.thumb img{width:100%;height:100%;object-fit:contain}.tile .info{padding:19px 20px 23px}.info small{font-size:12px;color:#2d9ac4;font-weight:800}.info strong{display:block;margin:7px 0;font-size:21px}.info span{color:#69818e;font-size:13px}.tile.wide{grid-column:span 1}.tile.wide .thumb{height:300px}.modal{position:fixed;inset:0;background:rgba(7,25,42,.88);z-index:50;display:none;align-items:center;justify-content:center;padding:54px 65px}.modal.open{display:flex}.modal img{max-width:100%;max-height:calc(100vh - 140px);object-fit:contain;box-shadow:0 15px 55px #0006}.close,.arrow{position:absolute;border:0;background:#ffffff26;color:white;border-radius:100px;display:grid;place-items:center}.close{right:20px;top:18px;width:44px;height:44px;font-size:30px}.arrow{top:50%;width:43px;height:52px;font-size:30px;transform:translateY(-50%)}.prev{left:12px}.next{right:12px}.modal-label{position:absolute;bottom:18px;color:white;font-size:15px;font-weight:700;text-align:center}.hint{margin-top:32px;color:#77919e;text-align:center;font-size:13px}footer{text-align:center;padding:28px;color:#678797;background:#e6f5fa;font-size:13px}@media(max-width:850px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.tile.wide{grid-column:span 1}}@media(max-width:560px){header{padding:48px 22px 58px}.gallery{grid-template-columns:1fr;gap:16px}.tile.wide{grid-column:span 1}.thumb,.tile.wide .thumb{height:260px}.modal{padding:65px 35px}.modal img{max-height:calc(100vh - 170px)}.arrow{width:31px;height:44px;font-size:24px}.prev{left:2px}.next{right:2px}.close{right:10px;top:10px}}
</style></head><body><header><div class="inner"><div class="eyebrow">GAPLEJIU · OCEAN CAMPAIGN</div><h1>가져와요 플라스틱,<br>지켜가요 우리바다.</h1><p>작은 실천이 모여 깨끗한 바다를 만듭니다.<br>가플지우 해양환경 캠페인 디자인 아카이브</p></div></header><main><div class="section-label">CAMPAIGN DESIGN</div><h2 class="section-title">프로젝트 작품 보기</h2><p class="desc">작품을 클릭하면 원본 디자인을 크게 볼 수 있습니다. 좌우 화살표로 다른 작품을 감상해 보세요.</p><div class="gallery" id="gallery"></div><p class="hint">클릭하여 확대 · ESC로 닫기 · 방향키로 이동</p></main><footer>가플지우 캠페인 | 1팀 디자인 프로젝트</footer><div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="작품 확대 보기"><button class="close" id="close" aria-label="닫기">×</button><button class="arrow prev" id="prev" aria-label="이전 작품">‹</button><img id="large" alt=""><button class="arrow next" id="next" aria-label="다음 작품">›</button><div class="modal-label" id="modalLabel"></div></div><script>
const works=[{title:'가플지우 리플릿 · 바깥면',type:'LEAFLET',src:'images/leaflet_1.jpg',wide:true},{title:'가플지우 리플릿 · 안쪽면',type:'LEAFLET',src:'images/leaflet_2.jpg',wide:true},{title:'이달의 바다',type:'POSTER',src:'images/poster1_1.jpg'},{title:'가져와요 플라스틱',type:'POSTER',src:'images/poster2_1.jpg'},{title:'이달의 바다',type:'X-BANNER',src:'images/banner1_1.jpg'},{title:'가져와요 플라스틱',type:'X-BANNER',src:'images/banner2_1.jpg'}];
const gallery=document.getElementById('gallery'),modal=document.getElementById('modal'),large=document.getElementById('large'),label=document.getElementById('modalLabel');let current=0,lastFocus=null;works.forEach((w,i)=>{const btn=document.createElement('button');btn.className='tile'+(w.wide?' wide':'');btn.innerHTML=`<div class="thumb"><img loading="lazy" src="${w.src}" alt="${w.title}"></div><div class="info"><small>${w.type}</small><strong>${w.title}</strong><span>클릭해서 크게 보기 ↗</span></div>`;btn.addEventListener('click',()=>{lastFocus=btn;show(i);modal.classList.add('open');document.body.style.overflow='hidden';document.getElementById('close').focus()});gallery.appendChild(btn)});function show(i){current=(i+works.length)%works.length;large.src=works[current].src;large.alt=works[current].title;label.textContent=`${works[current].title} · ${current+1} / ${works.length}`}function closeModal(){modal.classList.remove('open');document.body.style.overflow='';lastFocus?.focus()}document.getElementById('close').onclick=closeModal;document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.addEventListener('keydown',e=>{if(!modal.classList.contains('open'))return;if(e.key==='Escape')closeModal();if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight')show(current+1)});
</script></body></html>
